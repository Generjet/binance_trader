{% extends "layouts/base.html" %}

{% block content %}
<div class="pc-container">
    <div class="pc-content">
    <h2>Yearly Western Horoscopes</h2>
    <a href="{{ url_for('blog.create_horoscope') }}" class="btn btn-primary mb-3">
        Create New Horoscope
    </a>

    <div class="card">
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Zodiac</th>
                        <th>Year</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for horoscope in horoscopes %}
                    <tr>
                        <td>{{ horoscope.zodiac }}</td>
                        <td>{{ horoscope.year }}</td>
                        <td>
                            <a href="{{ url_for('blog.view_horoscope', id=horoscope.id) }}" class="btn btn-sm btn-info">
                                View
                            </a>
                            <a href="{{ url_for('blog.edit_horoscope', id=horoscope.id) }}" class="btn btn-sm btn-warning">
                                Edit
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    </div> 
</div>
{% endblock %}
