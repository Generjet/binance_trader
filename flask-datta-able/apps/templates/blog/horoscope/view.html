{% extends "layouts/base.html" %}

{% block content %}
<div class="pc-container">
    <div class="pc-content">
    <h2>{{ horoscope.zodiac }} Horoscope for {{ horoscope.year }}</h2>
    
    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-md-3">
                    <strong>Zodiac:</strong>
                </div>
                <div class="col-md-9">
                    {{ horoscope.zodiac }}
                </div>
            </div>
            
            <div class="row mt-3">
                <div class="col-md-3">
                    <strong>Year:</strong>
                </div>
                <div class="col-md-9">
                    {{ horoscope.year }}
                </div>
            </div>
            
            <div class="row mt-3">
                <div class="col-md-3">
                    <strong>Content:</strong>
                </div>
                <div class="col-md-9">
                    {{ horoscope.content|safe }}
                </div>
            </div>
            
            <div class="mt-4">
                <a href="{{ url_for('blog.horoscope_index') }}" class="btn btn-secondary">
                    Back to List
                </a>
            </div>
        </div>
    </div>
    </div>
</div>
{% endblock %}
