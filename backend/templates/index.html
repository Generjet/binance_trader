<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading System</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body class="bg-gray-900 text-white">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl text-center text-green-500 mb-4">Crypto Trading System</h1>
        <div class="mb-4">
            <input id="symbol-input" type="text" placeholder="Symbol" value="ETHUSDT" class="p-2 rounded bg-gray-800 text-white mr-2">
            <input id="timePeriod-input" type="text" placeholder="Time Period" value="1h" class="p-2 rounded bg-gray-800 text-white mr-2">
            <input id="lookback-input" type="number" placeholder="Lookback" value="30" class="p-2 rounded bg-gray-800 text-white mr-2">
            <button id="execute-button" class="p-2 bg-green-500 rounded">Execute</button>
        </div>
        <div id="charts">
            <div id="candlestick-chart" class="mb-4"></div>
            <div id="stochastic-chart" class="mb-4"></div>
            <div id="macd-chart" class="mb-4"></div>
            <div id="rsi-chart" class="mb-4"></div>
            <div id="ema-chart" class="mb-4"></div>
        </div>
    </div>
    <script>
        const socket = io();

        document.getElementById('execute-button').addEventListener('click', () => {
            const symbol = document.getElementById('symbol-input').value;
            const timePeriod = document.getElementById('timePeriod-input').value;
            const lookback = document.getElementById('lookback-input').value;
            socket.emit('start_analysis', { symbol, timePeriod, lookback });
        });

        socket.on('update_data', (data) => {
            const trace1 = {
                x: data.map(d => d.Time),
                open: data.map(d => d.Open),
                high: data.map(d => d.High),
                low: data.map(d => d.Low),
                close: data.map(d => d.Close),
                type: 'candlestick'
            };

            const trace2 = {
                x: data.map(d => d.Time),
                y: data.map(d => d.K),
                type: 'scatter',
                name: '%K'
            };

            const trace3 = {
                x: data.map(d => d.Time),
                y: data.map(d => d.D),
                type: 'scatter',
                name: '%D'
            };

            const trace4 = {
                x: data.map(d => d.Time),
                y: data.map(d => d.rsi),
                type: 'scatter',
                name: 'RSI'
            };

            Plotly.newPlot('candlestick-chart', [trace1]);
            Plotly.newPlot('stochastic-chart', [trace2, trace3]);
            Plotly.newPlot('rsi-chart', [trace4]);
        });
    </script>
</body>
</html>
